name: Database Migration Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment (staging, production)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
  push:
    branches:
      - main
    paths:
      - 'src/database/schema/**'
      - 'src/database/migrations/**'

jobs:
  migrate:
    name: Run Drizzle Database Migrations
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Apply Drizzle Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate

      - name: Migration Status Notification
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Database migration applied successfully to ${{ inputs.environment || 'production' }}!"
          else
            echo "❌ Database migration failed!"
          fi
